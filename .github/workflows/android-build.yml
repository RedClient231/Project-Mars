name: Build Project Mars APK

on:
  workflow_dispatch:
  push:
    branches:
      - project-jet-virtualapp-base

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-26" \
            "build-tools;26.0.2" \
            "extras;android;m2repository" \
            "extras;google;m2repository"

      - name: Install NDK r16b
        run: |
          # NDK r16b is not in sdkmanager catalog, download manually
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip" -o /tmp/ndk-r16b.zip
          unzip -q /tmp/ndk-r16b.zip -d /tmp/ndk-r16b
          mv /tmp/ndk-r16b/android-ndk-r16b $ANDROID_HOME/ndk/16.1.4479499

      - name: Patch SDK platform package.xml
        # AGP 3.0.1 fails parsing <base-extension> tag in newer platform XMLs
        run: |
          PLATFORM_XML="$ANDROID_HOME/platforms/android-26/package.xml"
          if [ -f "$PLATFORM_XML" ]; then
            sed -i '/<base-extension>/d' "$PLATFORM_XML"
            echo "Patched $PLATFORM_XML"
          fi

      - name: Switch to JDK 8 (for Gradle 4.1 / AGP 3.0.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./VirtualApp/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/16.1.4479499" >> ./VirtualApp/local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./VirtualApp/gradlew

      - name: Build debug APK
        working-directory: ./VirtualApp
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Mars-debug-apk
          path: VirtualApp/app/build/outputs/apk/debug/*.apk
