name: Build Project Mars NewBlackbox

on:
  workflow_dispatch:
  push:
    branches:
      - project-mars-newblackbox-base

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK
        run: sdkmanager "ndk;29.0.13846066"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Bcore debug AAR
        run: ./gradlew :Bcore:assembleDebug --no-daemon --stacktrace

      - name: List APK outputs
        run: find app/build/outputs/apk -name "*.apk" -print

      - name: List native libraries in APKs
        run: |
          for APK in $(find app/build/outputs/apk -name "*.apk"); do
            echo "===== $APK ====="
            unzip -l "$APK" | grep "lib/" || true
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project-Mars-NewBlackbox-debug-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload Bcore AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project-Mars-NewBlackbox-Bcore-aar
          path: Bcore/build/outputs/aar/**/*.aar
