name: Build Project Mars

on:
  push:
    branches: [ feature/play-games-readiness ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;29.0.13846066"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Bcore
        run: ./gradlew :Bcore:assembleDebug --no-daemon --stacktrace

      - name: Build App
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
